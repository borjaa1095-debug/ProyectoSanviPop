<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Add product | SanviPop</title>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="src/add-product.ts"></script>
  </head>

  <body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">SanviPop</a>
        <ul class="navbar-nav me-auto mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="add-product.html">New product</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="profile.html">My profile</a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="#" id="logout">Logout</a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="container">
      <h1 class='h3 mt-4'>New product</h1>
      <form action="#" class="mt-4 d-none" id="newProduct">
        <div class="mb-3">
          <label for="title">Title</label>
          <input type="text" class="form-control" name="title" id="title" placeholder="Product name" required minlength="3" maxlength="250">
          <div class="invalid-feedback">Title is required and must have at least 3 characters.</div>
        </div>
        <div class="mb-3">
          <label for="description">Description</label>
          <textarea class="form-control" id="description" name="description" rows="3" placeholder="Description..." required></textarea>
          <div class="invalid-feedback">Description is required.</div>
        </div>
        <div class="mb-3">
          <label for="price">Price</label>
          <input type="number" step="0.01" class="form-control" name="price" id="price" placeholder="Price" required min="0.01">
          <div class="invalid-feedback">Price is required and must be greater than zero.</div>
        </div>
        <div class="mb-3">
          <label for="category">Category</label>
          <select id="category" class="form-select" required>
            <option value="" selected>Choose a category...</option>
          </select>
          <div class="invalid-feedback">You must select a category.</div>
        </div>
        <div class="mb-3">
          <label for="image">Main photo</label>
          <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
          <div class="invalid-feedback">Photo is required.</div>
        </div>
        <fieldset class="mb-3 d-none" id="saleFields">
          <legend class="h6">Sale status</legend>
          <label for="saleStatus" class="form-label">Status</label>
          <select id="saleStatus" class="form-select">
            <option value="1">Available</option>
            <option value="2">Reserved</option>
            <option value="3">Sold</option>
          </select>
          <div class="mt-2 d-none" id="buyerFields">
            <label for="buyerSearch" class="form-label">Buyer name</label>
            <div class="input-group">
              <input id="buyerSearch" class="form-control" type="search" />
              <button type="button" class="btn btn-outline-secondary" id="findBuyer">Find buyer</button>
            </div>
            <label for="soldTo" class="form-label mt-2">Buyer</label>
            <select id="soldTo" class="form-select"></select>
          </div>
        </fieldset>
        <img src="" alt="" id="imgPreview" class="img-thumbnail d-none mb-3">
   
        <div>
          <button type="submit" class="btn btn-primary btn-lg">Create</button>
        </div>
      </form>
    </div>
  </body>
</html>
