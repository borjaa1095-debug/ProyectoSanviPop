<!DOCTYPE html>
<html lang="en">
  <head>
    <title>User profile | SanviPop</title>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="src/profile.ts"></script>
  </head>

  <body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">SanviPop</a>
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="add-product.html">New product</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="profile.html">My profile</a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="#" id="logout">Logout</a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="container">
      <div class="row mt-4 d-none" id="profile">
        <div class="col-3">
          <div>
            <img class="w-100" id="photo" alt="" />
            <label class="btn btn-sm btn-danger">
              <i class="bi bi-image"></i>
              <input type="file" id="photoInput" accept="image/*" class="visually-hidden" aria-label="Change profile photo" />
            </label>
          </div>
        </div>

        <div class="col-9" id="profileInfo">
          <!--  Cambiar h4 por inputs con un botón -->
          <h4 id="name">Tobby</h4>
          <h4 id="email">
            <small class="text-muted">tobby@sanvipop.com</small>
          </h4>
          <!-- Añadir campo de modificar password que muestre 2 campos -->
          <div class="mb-3">
            <button class="btn btn-primary" id="editProfile">
              <i class="bi bi-pencil-square"></i>
              Edit profile
            </button>
            <button class="btn btn-success" id="editPassword">
              <i class="bi bi-lock-fill"></i>
              Edit password
            </button>
          </div>

          <div class="d-flex flex-wrap gap-2 pt-3 border-top" id="userProductsLinks">
            <a href="#" class="btn btn-outline-primary" id="linkSelling">
              <i class="bi bi-tag-fill"></i> On sale
            </a>
            <a href="#" class="btn btn-outline-success" id="linkSold">
              <i class="bi bi-check-circle-fill"></i> Sold
            </a>
            <a href="#" class="btn btn-outline-info" id="linkBought">
              <i class="bi bi-bag-check-fill"></i> Purchased
            </a>
            <a href="index.html?status=bookmarks" class="btn btn-outline-warning" id="linkFavorites">
              <i class="bi bi-bookmark-heart-fill"></i> Favorites
            </a>
            <a href="ratings.html" class="btn btn-outline-secondary" id="linkRatings"><i class="bi bi-star"></i> Received reviews</a>
          </div>
        </div>

        <div class="col-9 d-none" id="profileForm">
          <form>
            <div class="mb-3">
              <label for="profile-email">Email:</label>
              <input type="email" class="form-control" name="email" id="profile-email" placeholder="Email" required />
              <label for="profile-name">Name:</label>
              <input type="text" class="form-control" name="name" id="profile-name" placeholder="Name" required minlength="3" maxlength="120" />
            </div>
            <button type="submit" class="btn btn-primary">Save changes</button>
            <button type="button" class="btn btn-danger" id="cancelEditProfile">Cancel</button>
          </form>
        </div>

        <div class="col-9 d-none" id="passwordForm">
          <form>
            <div class="mb-3">
              <label for="password">Password:</label>
              <input type="password" class="form-control" name="password" id="password" placeholder="Password" required minlength="4" />
              <label for="password2">Repeat password:</label>
              <input type="password" class="form-control" name="password2" id="password2" placeholder="Repeat password" required minlength="4" />
            </div>
            <button type="submit" class="btn btn-primary">Save changes</button>
            <button type="button" class="btn btn-danger" id="cancelEditPassword">Cancel</button>
          </form>
        </div>
      </div>
      <div class="mt-4 d-none" id="map"></div>
    </div>
  </body>
</html>
